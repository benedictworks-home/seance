[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seance"
version = "0.1.0"
description = "Capture, diff, and certify web sources over time."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "brotli>=1.1",
    "protego>=0.3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "trustme>=1.1",
    "pytest-httpserver>=1.0",
]

[project.scripts]
seance = "seance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.hatch.envs.default]
features = ["dev"]
